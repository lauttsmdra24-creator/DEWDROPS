<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>DEWDROP</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<button id="snd" class="snd" aria-label="Suara">
 <svg viewBox="0 0 16 16" shape-rendering="crispEdges"><path d="M2 6h3l4-3v10l-4-3H2z" fill="#fff"/><path class="wv" d="M11 5h1v1h1v4h-1v1h-1v-1h1V6h-1z" fill="#fff"/><path class="x" d="M11 5l4 6m0-6l-4 6" stroke="#fff" stroke-width="1.4" fill="none"/></svg>
</button>

<!-- PAGE 1 -->
<section id="p1" class="page active">
 <canvas class="bg" data-sky="day"></canvas>
 <canvas class="bg" data-clouds="ground"></canvas>
 <div class="floaters"></div>
 <div class="glass">
  <h1 class="title">DEWDROPS</h1>
  <button id="playBtn" class="play" aria-label="Play"><i></i></button>
  <div class="by">by: eternityll0ve</div>
 </div>
 <div class="sparks" id="sparks"></div>
</section>

<!-- PAGE 2 -->
<section id="p2" class="page">
 <canvas class="bg" data-sky="day"></canvas>
 <canvas class="bg" data-clouds="ground"></canvas>
 <div class="floaters"></div>
 <div class="game">
  <div class="walklayer" id="walkLayer"></div>
  <div class="hud"><div class="hearts" id="hearts"></div></div>
  <div class="trayzone"><div class="tray" id="tray"></div></div>
  <div class="dewzone">
   <div class="dewwrap" id="dewWrap">
    <canvas id="dew2"></canvas>
    <div class="dewhit" id="dewHit"></div>
    <div class="bubble" id="bubble"><canvas id="want" width="24" height="24"></canvas></div>
    <div class="fx" id="fx2"></div>
   </div>
  </div>
 </div>
</section>

<!-- PAGE 3 -->
<section id="p3" class="page">
 <canvas class="bg" data-sky="dusk"></canvas>
 <div class="stars" id="stars"></div>
 <canvas id="moon" class="moon" width="18" height="18"></canvas>
 <canvas class="bg" data-clouds="ground"></canvas>
 <div class="endwrap">
  <div class="dewwrap" id="dewWrap3"><canvas id="dew3"></canvas><div class="fx" id="fx3"></div></div>
  <button id="again" class="btn">PLAY AGAIN</button>
 </div>
</section>

<script src="script.js"></script>
</body>
</html>
